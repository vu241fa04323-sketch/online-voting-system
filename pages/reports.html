<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Election Audit &amp; Reports — VoteSecure</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    @media print {
      .sidebar, .topbar, .btn, .filter-actions, .toolbar, .no-print {
        display: none !important;
      }
      .main-wrapper {
        margin-left: 0 !important;
        width: 100% !important;
      }
      .main-content {
        padding: 0 !important;
      }
      .card {
        box-shadow: none !important;
        border: 1px solid #ddd !important;
        margin-bottom: 1.5rem !important;
        break-inside: avoid;
      }
      body {
        background: #fff !important;
        color: #000 !important;
      }
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Admin Navigation">
      <div class="sidebar-header">
        <a href="admin-dashboard.html" class="sidebar-brand">
          <img src="../assets/images/logo.svg" alt="VoteSecure Logo" style="height: 32px; filter: brightness(0) invert(1);">
        </a>
        <span class="sidebar-role-badge">Admin</span>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-heading">Navigation</div>
        <a href="admin-dashboard.html" class="nav-item">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="elections.html" class="nav-item">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/></svg>
          <span>Elections</span>
        </a>
        <a href="posts.html" class="nav-item">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
          <span>Posts</span>
        </a>
        <a href="voters.html" class="nav-item">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z"/></svg>
          <span>Voters</span>
        </a>
        <a href="candidates.html" class="nav-item">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
          <span>Candidates</span>
        </a>

        <div class="sidebar-heading">Analytics &amp; Tools</div>
        <a href="results.html" class="nav-item">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/></svg>
          <span>Results</span>
        </a>
        <a href="reports.html" class="nav-item active">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/></svg>
          <span>Reports</span>
        </a>
        <a href="settings.html" class="nav-item">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-summary">
          <div class="user-avatar">AD</div>
          <div class="user-info">
            <div class="user-info-name user-display-name">Administrator</div>
            <div class="user-info-sub">System Root</div>
          </div>
          <button type="button" class="btn btn-sm btn-outline-danger" data-action="logout" title="Sign Out" style="padding: 0.25rem 0.5rem;">
            ⏻
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle-btn" id="sidebar-toggle" aria-label="Toggle navigation">
            <svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
          </button>
          <h1 class="topbar-title">Election Reports &amp; Exports</h1>
        </div>

        <div class="topbar-right">
          <div style="display: flex; gap: 0.75rem;">
            <button type="button" class="btn btn-secondary" id="btn-print-report">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 4v3H4a2 2 0 00-2 2v3a2 2 0 002 2h1v2a2 2 0 002 2h6a2 2 0 002-2v-2h1a2 2 0 002-2V9a2 2 0 00-2-2h-1V4a2 2 0 00-2-2H7a2 2 0 00-2 2zm8 0H7v3h6V4zm0 8H7v4h6v-4z" clip-rule="evenodd"/></svg>
              Print Report
            </button>
            <button type="button" class="btn btn-primary" id="btn-export-csv">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
              Export CSV
            </button>
          </div>
        </div>
      </header>

      <main class="main-content">
        <!-- Selector Toolbar (Section 36) -->
        <div class="toolbar">
          <div>
            <h3 style="font-size: 1.15rem; margin-bottom: 0.2rem;" id="report-title-display">Election Comprehensive Report</h3>
            <span style="font-size: 0.85rem; color: var(--slate-500);" id="report-generated-date">Generating report...</span>
          </div>

          <div class="filter-actions">
            <!-- Report Type Dropdown (Section 36) -->
            <label for="report-type-selector" style="font-size: 0.85rem; font-weight: 600; color: var(--slate-600); margin: 0;">Report Type:</label>
            <select id="report-type-selector" class="form-control" style="width: auto; font-weight: 600;">
              <option value="election">Election Report</option>
              <option value="voters">Voter List Report</option>
              <option value="candidates">Candidate List Report</option>
              <option value="participation">Voting Participation Report</option>
              <option value="post-results">Post-Wise Results</option>
              <option value="cand-results">Candidate Results</option>
            </select>

            <!-- Election Selector -->
            <label for="report-election-selector" style="font-size: 0.85rem; font-weight: 600; color: var(--slate-600); margin: 0;">Election:</label>
            <select id="report-election-selector" class="form-control" style="width: auto; font-weight: 600;">
              <!-- Populated dynamically -->
            </select>
          </div>
        </div>

        <!-- Dynamic Report Container -->
        <div id="dynamic-report-container">
          <!-- Populated dynamically based on report-type-selector -->
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/reports.js"></script>
</body>
</html>
