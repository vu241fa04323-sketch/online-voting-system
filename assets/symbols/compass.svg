<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="compassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="42" fill="#fff1f2" stroke="#e11d48" stroke-width="4"/>
  <circle cx="50" cy="50" r="34" fill="none" stroke="#fda4af" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- North pointer -->
  <polygon points="50,16 57,50 50,46" fill="url(#compassGrad)"/>
  <polygon points="50,16 43,50 50,46" fill="#fb7185"/>
  <!-- South pointer -->
  <polygon points="50,84 57,50 50,54" fill="#64748b"/>
  <polygon points="50,84 43,50 50,54" fill="#94a3b8"/>
  <!-- Center pin -->
  <circle cx="50" cy="50" r="4" fill="#881337"/>
  <!-- Direction markers -->
  <text x="50" y="27" font-size="8" font-family="sans-serif" font-weight="bold" fill="#be123c" text-anchor="middle">N</text>
  <text x="50" y="78" font-size="8" font-family="sans-serif" font-weight="bold" fill="#64748b" text-anchor="middle">S</text>
</svg>
